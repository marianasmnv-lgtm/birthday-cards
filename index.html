<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор на Картички за Рожден Ден</title>
    <style>
        :root {
            --primary: #ff4757;
            --background: #f1f2f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2f3542;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #57606f;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ced6e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        .image-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .image-option {
            border: 3px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 1;
            transition: transform 0.2s, border-color 0.2s;
        }
        .image-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-option.selected {
            border-color: var(--primary);
            transform: scale(0.95);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #ff6b81;
        }
        .card-preview-area {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        .birthday-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .birthday-card img {
            width: 100%;
            display: block;
        }
        .birthday-card .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: white;
            padding: 50px 20px 25px 20px;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .share-section {
            display: flex;
            gap: 10px;
        }
        .share-url {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            background: #f8f9fa;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .copy-btn {
            width: auto;
            background: #2ed573;
            padding: 10px 15px;
        }
        .copy-btn:hover {
            background: #26af5f;
        }
        .back-btn {
            background: #747d8c;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: #57606f;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="creator-view">
        <h1>Създай Картичка 🎂</h1>
        <div class="form-group">
            <label for="nameInput">Име на рожденика:</label>
            <input type="text" id="nameInput" placeholder="Въведи име тук...">
        </div>
        
        <label>Избери картинка:</label>
        <div class="image-picker" id="imagePicker">
            <!-- Сега зареждаме директно от вашия GitHub хостинг -->
            <div class="image-option selected" data-img-idx="0">
                <img src="baloni.jpg" alt="Балони">
            </div>
            <div class="image-option" data-img-idx="1">
                <img src="torta.jpg" alt="Торта">
            </div>
            <div class="image-option" data-img-idx="2">
                <img src="podarak.jpg" alt="Подарък">
            </div>
        </div>

        <button id="generateBtn">Генерирай Картичка</button>
    </div>

    <div id="preview-view" class="card-preview-area">
        <div class="birthday-card">
            <img id="cardImage" src="" alt="Рожден Ден">
            <div class="card-text" id="cardText">Happy birthday, Name</div>
        </div>
        
        <div class="share-section" id="shareSection">
            <div class="share-url" id="shareUrlText">Линк за споделяне...</div>
            <button class="copy-btn" id="copyBtn">Копирай</button>
        </div>
        <button class="back-btn" id="backBtn">Създай нова</button>
    </div>
</div>

<script>
    // Пътища към вашите собствени GitHub картинки
    const images = [
        "baloni.jpg",
        "torta.jpg",
        "podarak.jpg"
    ];

    let selectedImgIdx = 0;

    const creatorView = document.getElementById('creator-view');
    const previewView = document.getElementById('preview-view');
    const nameInput = document.getElementById('nameInput');
    const imagePicker = document.getElementById('imagePicker');
    const generateBtn = document.getElementById('generateBtn');
    const cardImage = document.getElementById('cardImage');
    const cardText = document.getElementById('cardText');
    const shareUrlText = document.getElementById('shareUrlText');
    const copyBtn = document.getElementById('copyBtn');
    const backBtn = document.getElementById('backBtn');
    const shareSection = document.getElementById('shareSection');

    imagePicker.addEventListener('click', (e) => {
        const option = e.target.closest('.image-option');
        if (!option) return;
        
        document.querySelectorAll('.image-option').forEach(el => el.classList.remove('selected'));
        option.classList.add('selected');
        selectedImgIdx = parseInt(option.dataset.imgIdx);
    });

    function displayCard(name, imgIdx) {
        cardImage.src = images[imgIdx];
        cardText.textContent = `Happy birthday, ${name || 'Friend'}!`;
        
        creatorView.style.display = 'none';
        previewView.style.display = 'block';
    }

    generateBtn.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if(!name) {
            alert('Моля, въведете име!');
            return;
        }

        const shareUrl = new URL(window.location.href);
        shareUrl.searchParams.set('name', name);
        shareUrl.searchParams.set('img', selectedImgIdx);

        shareUrlText.textContent = shareUrl.toString();
        displayCard(name, selectedImgIdx);
        shareSection.style.display = 'flex'; 
    });

    copyBtn.addEventListener('click', () => {
        const textToCopy = shareUrlText.textContent;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Копирано!';
            copyBtn.style.backgroundColor = '#2ed573';
            setTimeout(() => {
                copyBtn.textContent = originalText;
            }, 2000);
        });
    });

    backBtn.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.search = '';
        window.history.pushState({}, '', url);

        creatorView.style.display = 'block';
        previewView.style.display = 'none';
        nameInput.value = '';
    });

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        const imgParam = urlParams.get('img');

        if (nameParam !== null) {
            displayCard(nameParam, parseInt(imgParam) || 0);
            shareSection.style.display = 'none'; 
            backBtn.textContent = 'Създай своя картичка';
        }
    });
</script>

</body>
</html>
